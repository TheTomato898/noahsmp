<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoahSMP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class='content'>
    <div class='section'>
      <div class='container'>
        <h1>NoahSMP</h1>
        <p>NoahSMP | Minecraft SMP Server</p>
        <a href="https://dsc.gg/noahsmp" class='button'>Trete dem Discord bei</a>
        </div>
      </div>
    <div class='section2'>
      <div class='container fade-in'>
        <h2>Komm jetzt drauf</h2>
        <p>Habe ein unvergessliches Spielerlebnis</p>
        <h3 class='button' id='copy-button'>
          <span id='copy-icon'>
            <i data-lucide="copy"></i>
          </span>
          <span id='copy-text'>Copy Server IP</span>
        </h3>
      </div>
    </div>
    <div class='section3'>
      <div class='container fade-in'>
        <h2>Das Team</h2>
        <p class='description'>Bei Fragen und Problemen zur Stelle</p>
        <div class='list'>
          <div><i data-lucide="crown"></i><h4>Noah</h4><p>Owner</p></div>
          <div><i data-lucide="crown"></i><h4>Laura</h4><p>Owner</p></div>
          <div><i data-lucide="gem"></i><h4>Maiki</h4><p>Co-Owner</p></div>
          <div><i data-lucide="badge-check"></i><h4>Henex</h4><p>Moderator</p></div>
          <div><i data-lucide="badge-check"></i><h4>Vaipo</h4><p>Moderator</p></div>
          <div><i data-lucide="badge-check"></i><h4>Frozen</h4><p>Moderator</p></div>
          <div><i data-lucide="badge-check"></i><h4>Tutu</h4><p>Moderator</p></div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src='script.js'></script>
</body>
</html>
